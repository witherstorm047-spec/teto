name: Gerar APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Instalar dependências
        run: npm install
      - name: Criar o projeto Android
        run: npx cap add android
      - name: Gerar ícones
        continue-on-error: true
        run: npx capacitor-assets generate --android --iconBackgroundColor '#fefefe' --iconBackgroundColorDark '#fefefe'
      - name: Permissão de notificações
        run: |
          F=android/app/src/main/AndroidManifest.xml
          grep -q POST_NOTIFICATIONS "$F" || sed -i 's#<uses-permission android:name="android.permission.INTERNET" */>#&\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />#' "$F"
      - name: Sincronizar
        run: npx cap sync android
      - name: Compilar APK
        working-directory: android
        run: ./gradlew assembleDebug
      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: teto-word-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
