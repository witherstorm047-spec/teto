<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#fefefe">
  <title>Teto word of the day</title>
  <style>
    :root { --bg: #fefefe; --pink: #d4365c; }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden;
                 font-family: "Segoe UI", Roboto, system-ui, sans-serif; user-select: none; -webkit-user-select: none; }
    body { padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
    #stage { height: 100%; display: flex; align-items: center; justify-content: center; }
    #box { width: 100%; display: flex; flex-direction: column; align-items: center; text-align: center; padding: 0 5vw; }
    #sprite { width: min(80vw, 420px); height: auto; display: block; }
    #title { color: var(--pink); font-weight: 700; font-size: clamp(16px, 4.6vw, 28px); margin-top: 8px; }
    #wordline { width: 100%; margin-top: 4px; line-height: 1.25; white-space: nowrap; font-weight: 700; color: #2b2b3a; }
    #rest { color: transparent; }
    #def { color: #555; font-size: clamp(15px, 4.2vw, 22px); max-width: 560px; margin-top: 10px;
           min-height: 4.5em; opacity: 0; transition: opacity .6s; line-height: 1.35; }
    #def.on { opacity: 1; }
    #hint { position: fixed; left: 0; right: 0; bottom: calc(env(safe-area-inset-bottom) + 10px);
            text-align: center; color: #aaa; font-size: 12px; pointer-events: none; }
    #sched { position: fixed; right: calc(env(safe-area-inset-right) + 14px); bottom: calc(env(safe-area-inset-bottom) + 8px);
             color: #888; font-size: 13px; padding: 8px; text-decoration: underline; cursor: pointer; }
    #toast { position: fixed; left: 50%; top: calc(env(safe-area-inset-top) + 16px); transform: translateX(-50%);
             background: #2b2b3a; color: #fff; padding: 10px 16px; border-radius: 12px; font-size: 14px;
             opacity: 0; transition: opacity .3s; pointer-events: none; max-width: 90vw; text-align: center; z-index: 20; }
    #toast.on { opacity: 1; }
    #modal { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: none; align-items: center; justify-content: center; z-index: 10; }
    #modal.on { display: flex; }
    #card { background: #fff; border-radius: 16px; padding: 22px 24px; width: min(88vw, 340px); text-align: center; }
    #card p { margin: 0 0 14px; font-size: 16px; color: #333; }
    #card input { font-size: 34px; font-family: inherit; text-align: center; border: 2px solid #ddd; border-radius: 10px; padding: 6px 10px; width: 100%; }
    #card button { margin-top: 16px; font-size: 16px; padding: 10px 22px; border: 0; border-radius: 10px; cursor: pointer; }
    #save { background: var(--pink); color: #fff; font-weight: 600; }
    #later { background: transparent; color: #888; }
  </style>
</head>
<body>
  <div id="stage">
    <div id="box">
      <img id="sprite" src="frames/0.png" alt="Teto" draggable="false">
      <div id="title">Teto word of the day</div>
      <div id="wordline"><span id="shown"></span><span id="rest"></span></div>
      <div id="def"></div>
    </div>
  </div>
  <div id="hint">Toca no ecrã para ouvir outra vez</div>
  <div id="sched">Mudar horário</div>
  <div id="toast"></div>

  <div id="modal">
    <div id="card">
      <p>A que horas queres que a Teto apareça todos os dias?</p>
      <input id="time" type="time" value="09:00">
      <div>
        <button id="save">Guardar</button>
        <button id="later">Agora não</button>
      </div>
    </div>
  </div>

  <script src="logic.js"></script>
  <script src="app.js"></script>
</body>
</html>
